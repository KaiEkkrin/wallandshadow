# =============================================================================
# Ansible variables — Wall & Shadow VPS configuration
# =============================================================================
# These are non-secret configuration values. Secrets (passwords, keys) are
# generated by the playbook on the first provision and kept on the VPS's
# persistent volume (see the Persistent volume section below).
# =============================================================================

# ── PostgreSQL ────────────────────────────────────────────────────────────────
pg_version: "17"
pg_user: "was"
pg_db_prod: "wallandshadow"
pg_db_test: "wallandshadow_test"

# ── Application containers ───────────────────────────────────────────────────
app_port_prod: 3001
app_port_test: 3002

# ── Domains (Caddy reverse proxy) ────────────────────────────────────────────
# Update these to match your actual domain before running the playbook.
domain_prod: "wallandshadow.com"
domain_test: "test.wallandshadow.com"

# ── Rendered configuration on the VPS ────────────────────────────────────────
# Env files, image tags, CORS policies and the goaccess config. The playbook
# re-renders all of it (the deploy workflows rewrite the image tags), so it
# lives on the root disk.
secrets_dir: "/etc/wallandshadow"

# ── Persistent volume ────────────────────────────────────────────────────────
# Everything that must survive a server rebuild lives on the Hetzner volume
# (docs/SERVER_OPERATIONS.md). The mount point keeps its original name:
#   /mnt/pgdata/main           PostgreSQL data directory
#   /mnt/pgdata/wallandshadow  secrets file (DB password, JWT secret, S3 keys)
#   /mnt/pgdata/caddy          Caddy's certificates and ACME account
# volume_id is required, via -e volume_id=... (the provision workflow passes
# the OpenTofu output).
pgdata_mount: "/mnt/pgdata"
secrets_file: "{{ pgdata_mount }}/wallandshadow/secrets"
caddy_storage_dir: "{{ pgdata_mount }}/caddy"

# Where the secrets file and Caddy's data lived before they moved onto the
# volume. The playbook migrates each once (see playbook.yml).
legacy_secrets_file: "/etc/wallandshadow/secrets"
caddy_legacy_data_dir: "/var/lib/caddy/.local/share/caddy"

# ── S3 / Object Storage ──────────────────────────────────────────────────────
# Endpoint and bucket for backups. Credentials passed as extra-vars from the
# provision workflow (originally GitHub Secrets).
# s3_access_key: set via -e
# s3_secret_key: set via -e
s3_endpoint: "https://hel1.your-objectstorage.com"
s3_bucket_backups: "wallandshadow-backups"
s3_bucket_prod: "wallandshadow-prod"
s3_bucket_test: "wallandshadow-test"

# ── Backup ────────────────────────────────────────────────────────────────────
backup_hour: "3"
backup_minute: "0"
