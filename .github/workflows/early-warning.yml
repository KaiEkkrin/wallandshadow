# =============================================================================
# Early warning — breakage that arrives without a commit of ours:
#   - a download or image the dev container needs disappearing or changing
#     (a fresh runner re-fetches all of them, including the curl | bash,
#     brew, `playwright install-deps` and gh extension installs; MinIO's
#     removal would have failed here the week it happened),
#   - CI failing on something that floats: the lockfile installs exactly,
#     but the node, postgres and caddy images, the runner image and the
#     unpinned `pip install ansible ansible-lint` move on their own.
# Pull requests that change the dev container get the dev container build.
#
# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. If the weekly runs stop, re-enable this
# workflow from the Actions tab.
# =============================================================================
name: Early warning

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/early-warning.yml"

permissions: {}

jobs:
  ci:
    name: CI (every verification)
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      force_all: true

  devcontainer:
    name: Dev container build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # `build` never applies runArgs, so the gitignored --env-file doesn't
      # matter here.
      - name: Build the dev container image
        run: >-
          npx --yes @devcontainers/cli@0.89.0 build
          --workspace-folder .
          --config .devcontainer/devcontainer.json
          --image-name wallandshadow-devcontainer:ci
