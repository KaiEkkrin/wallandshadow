# =============================================================================
# Provision infrastructure via OpenTofu + Ansible
# =============================================================================
# Manual trigger only — infrastructure changes are intentional.
#
# Two-stage pipeline:
#   1. OpenTofu: provisions Hetzner Cloud resources (VPS, volume, static IPs, firewall)
#   2. Ansible:  configures VPS contents (PostgreSQL, Caddy, Docker, backups, secrets)
#
# Inputs:
#   apply          — off (the default): show the OpenTofu plan in the run
#                    summary and change nothing. On: apply it, then run Ansible.
#   allow_replace  — the run fails if the plan deletes or replaces any
#                    resource, unless this is ticked.
#   replace_server — plan a rebuild of the server from scratch (implies
#                    allow_replace). Read docs/SERVER_OPERATIONS.md first.
#
# OpenTofu outputs (VPS IP, volume ID) feed directly into Ansible — no manual
# copy-paste of generated values.
#
# Prerequisites (GitHub Secrets):
#   HCLOUD_TOKEN              — Hetzner Cloud API token
#   SSH_PRIVATE_KEY           — SSH key for VPS access
#   HCLOUD_S3_ACCESS_KEY      — Hetzner Object Storage access key (state backend + app)
#   HCLOUD_S3_SECRET_KEY      — Hetzner Object Storage secret key (state backend + app)
#   OIDC_ISSUER               — Zitadel OIDC issuer URL
#   OIDC_TEST_CLIENT_ID       — Zitadel OIDC client ID (test environment)
#   OIDC_PROD_CLIENT_ID       — Zitadel OIDC client ID (production environment)
#   STATS_BASIC_AUTH_USER     — Username for HTTP basic auth on /stats (goaccess)
#   STATS_BASIC_AUTH_PASSWORD — Password for HTTP basic auth on /stats (goaccess)
#   ADMIN_USER_ID             — (optional) OIDC subject of the user to auto-promote
#                                to admin tier on the production server
#
# First-time setup: see docs/INFRASTRUCTURE_BOOTSTRAP.md.
# =============================================================================

name: Provision Infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan and run Ansible (unticked shows the plan only)
        type: boolean
        default: false
      allow_replace:
        description: Allow a plan that deletes or replaces resources
        type: boolean
        default: false
      replace_server:
        description: Rebuild the server from scratch (see docs/SERVER_OPERATIONS.md)
        type: boolean
        default: false

# Two overlapping runs would race on the OpenTofu state, and the S3 backend
# has no locking, so a second run queues until the first finishes.
concurrency:
  group: provision
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Stage 1: Provision cloud resources ────────────────────────────────────
  opentofu:
    runs-on: ubuntu-latest
    environment: hetzner
    outputs:
      vps_ip: ${{ steps.output.outputs.vps_ip }}
      vps_ipv6: ${{ steps.output.outputs.vps_ipv6 }}
      volume_id: ${{ steps.output.outputs.volume_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12"
          # The wrapper echoes each command into stdout, which would corrupt
          # the plan JSON written by `tofu show -json` below.
          tofu_wrapper: false

      - name: Derive SSH public key
        id: ssh_pubkey
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          SSH_PUBLIC_KEY=$(ssh-keygen -y -f /tmp/ssh_key)
          rm /tmp/ssh_key
          echo "value=$SSH_PUBLIC_KEY" >> "$GITHUB_OUTPUT"

      - name: OpenTofu init
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HCLOUD_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HCLOUD_S3_SECRET_KEY }}
        run: tofu init

      - name: OpenTofu plan
        working-directory: infra
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HCLOUD_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HCLOUD_S3_SECRET_KEY }}
        run: |
          tofu plan -var="ssh_public_key=${{ steps.ssh_pubkey.outputs.value }}" \
            ${{ inputs.replace_server && '-replace=hcloud_server.main' || '' }} \
            -out=tfplan

      - name: Show the plan
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HCLOUD_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HCLOUD_S3_SECRET_KEY }}
        run: |
          tofu show -json tfplan > "$RUNNER_TEMP/plan.json"
          {
            echo '### OpenTofu plan'
            echo
            echo '```'
            tofu show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse plans that delete or replace resources
        if: ${{ !inputs.allow_replace && !inputs.replace_server }}
        run: infra/scripts/plan-guard.sh "$RUNNER_TEMP/plan.json"

      - name: OpenTofu apply
        if: ${{ inputs.apply }}
        working-directory: infra
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HCLOUD_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HCLOUD_S3_SECRET_KEY }}
        run: tofu apply tfplan

      # Plain assignments, so `bash -e` stops the step if any output is
      # missing; inside echo's arguments a failure would be swallowed and
      # Ansible would get empty values. Plan-only runs don't need outputs (a
      # brand-new project has no state to read them from).
      - name: Capture outputs
        id: output
        if: ${{ inputs.apply }}
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HCLOUD_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HCLOUD_S3_SECRET_KEY }}
        run: |
          vps_ip=$(tofu output -raw vps_ip)
          vps_ipv6=$(tofu output -raw vps_ipv6)
          volume_id=$(tofu output -raw volume_id)
          {
            echo "vps_ip=$vps_ip"
            echo "vps_ipv6=$vps_ipv6"
            echo "volume_id=$volume_id"
          } >> "$GITHUB_OUTPUT"

      - name: Display VPS IP
        if: ${{ inputs.apply }}
        run: |
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  VPS IPv4: ${{ steps.output.outputs.vps_ip }}"
          echo "║  VPS IPv6: ${{ steps.output.outputs.vps_ipv6 }}"
          echo "║  Volume:   ${{ steps.output.outputs.volume_id }}"
          echo "║                                                                  "
          echo "║  DNS records for test.wallandshadow.com:                         "
          echo "║    A    ${{ steps.output.outputs.vps_ip }}"
          echo "║    AAAA ${{ steps.output.outputs.vps_ipv6 }}"
          echo "╚══════════════════════════════════════════════════════════════════╝"

  # ── Stage 2: Configure VPS contents ───────────────────────────────────────
  ansible:
    needs: opentofu
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest
    environment: hetzner

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ansible
        run: |
          pip install ansible passlib
          ansible-galaxy collection install --upgrade ansible.posix community.postgresql community.general

      - name: Setup SSH key
        env:
          VPS_IP: ${{ needs.opentofu.outputs.vps_ip }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # A freshly created or rebuilt server takes a minute or two to start
          # sshd, so wait for it rather than failing the run.
          KNOWN_HOST=""
          for _ in $(seq 1 36); do
            KNOWN_HOST=$(ssh-keyscan -t rsa,ecdsa,ed25519 "$VPS_IP" 2>/dev/null || true)
            [ -n "$KNOWN_HOST" ] && break
            sleep 5
          done
          if [ -z "$KNOWN_HOST" ]; then
            echo "::error::ssh-keyscan returned no host keys for $VPS_IP after 3 minutes"
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Expose to later steps via a multi-line $GITHUB_ENV entry.
          {
            echo "VPS_KNOWN_HOST<<KNOWN_HOST_EOF"
            printf '%s\n' "$KNOWN_HOST"
            echo "KNOWN_HOST_EOF"
          } >> "$GITHUB_ENV"

      - name: Run Ansible playbook
        working-directory: ansible
        env:
          VPS_IP: ${{ needs.opentofu.outputs.vps_ip }}
        run: |
          ansible-playbook playbook.yml -i inventory.yml \
            -e 'volume_id=${{ needs.opentofu.outputs.volume_id }}' \
            -e 's3_access_key=${{ secrets.HCLOUD_S3_ACCESS_KEY }}' \
            -e 's3_secret_key=${{ secrets.HCLOUD_S3_SECRET_KEY }}' \
            -e 'oidc_issuer=${{ secrets.OIDC_ISSUER }}' \
            -e 'oidc_test_client_id=${{ secrets.OIDC_TEST_CLIENT_ID }}' \
            -e 'oidc_prod_client_id=${{ secrets.OIDC_PROD_CLIENT_ID }}' \
            -e 'stats_basic_auth_user=${{ secrets.STATS_BASIC_AUTH_USER }}' \
            -e 'stats_basic_auth_password=${{ secrets.STATS_BASIC_AUTH_PASSWORD }}' \
            -e 'admin_user_id=${{ secrets.ADMIN_USER_ID }}'

      - name: Display VPS_KNOWN_HOST secret value
        run: |
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  Set this GitHub Secret in the 'hetzner' environment:             "
          echo "║                                                                   "
          echo "║    VPS_KNOWN_HOST                                                 "
          echo "║                                                                   "
          echo "║  Value — copy the block between the lines below verbatim:        "
          echo "╠══════════════════════════════════════════════════════════════════╣"
          printf '%s\n' "$VPS_KNOWN_HOST"
          echo "╚══════════════════════════════════════════════════════════════════╝"
